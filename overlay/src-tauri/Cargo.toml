[package]
name = "poe2-jewel-overlay"
version = "0.1.0"
description = "PoE2 timeless-jewel capture overlay (contributor tool)"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Cross-platform screen capture. Pin loosely; adjust to the latest if resolution fails.
xcap = "0.0.14"
# Read the jewel's Ctrl+C item text straight off the OS clipboard (the click-through
# overlay window is unfocused, so the webview's navigator.clipboard can't).
arboard = "3"
# Decode + resize the reference socketed-jewel PNGs for template matching (jewel-type
# identification). PNG only — that's all the reference assets are.
image = { version = "0.25", default-features = false, features = ["png"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
