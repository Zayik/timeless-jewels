[package]
name = "poe2-jewel-overlay"
version = "0.1.0"
description = "PoE2 timeless-jewel capture overlay (contributor tool)"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# tray-icon: the overlay lives in the system tray (Show/Hide, Recalibrate, Quit) since the
# transparent click-through window has no title bar and stays out of the taskbar.
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
# Single-instance: a second launch surfaces the running overlay instead of spawning a
# duplicate window + tray icon (the global hotkeys would otherwise double-fire).
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Cross-platform screen capture. Pin loosely; adjust to the latest if resolution fails.
xcap = "0.0.14"
# Read the jewel's Ctrl+C item text straight off the OS clipboard (the click-through
# overlay window is unfocused, so the webview's navigator.clipboard can't).
arboard = "3"
# POST recorded observations to the Cloudflare Worker write endpoint. From Rust (not the
# webview) because the overlay's CSP blocks cross-origin fetch; rustls avoids OpenSSL.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
# On-device OCR of the transformed-notable tooltip via Windows.Media.Ocr — built into
# Windows, so no bundled OCR binaries or trained-data files.
[target.'cfg(windows)'.dependencies.windows]
version = "0.58"
features = [
  "Foundation",
  "Foundation_Collections",
  "Globalization",
  "Graphics_Imaging",
  "Media_Ocr",
  "Storage_Streams",
  "Win32_System_WinRT",
  # GetClipboardSequenceNumber — detects a deliberate Ctrl+C even when the copied text is
  # byte-identical to what was already on the clipboard (a raw text diff would miss that).
  "Win32_System_DataExchange",
  # SendInput — type each result-notable name into the in-game tree search during an auto-sweep
  # (the keystrokes go to the focused PoE2 window; the overlay never takes focus).
  "Win32_UI_Input_KeyboardAndMouse",
]

[dev-dependencies]
# Only the (ignored) ring/refine benchmark uses this — to load a screenshot PNG off disk.
image = { version = "0.25", default-features = false, features = ["png"] }

# `tauri dev` builds in the dev profile. The screen-capture template matching (acquire/
# zncc_rgb) is float-heavy and is unusably slow unoptimized (a full-screen acquire took
# ~16s/ref at opt-level 0), so optimize the dev build. The crate is tiny, so the extra
# compile time is negligible; deps are cached after the first build.
[profile.dev]
opt-level = 3

# Same reason for the (ignored) acquire benchmark under the test profile.
[profile.test]
opt-level = 3

# Compile ONLY this crate as a single codegen unit (deps keep building in parallel). At
# opt-level 3 with the default 256 units, an internalized `#[inline]` generic from a dependency
# (serde_json's `invalid_type`, instantiated via url::Url's Deserialize inside the
# tauri::generate_context!-expanded config code) gets referenced from one of our crate's objects
# while its definition lands in a different unit → `LNK2019: unresolved external symbol` at the
# final bin link (cargo check and the test harness don't hit it, only the bin link does). One unit
# keeps definition + reference together. Scoped to this package so a clean build of the heavy deps
# (tauri/reqwest/windows) stays parallel; the release profile already sets codegen-units = 1 globally.
[profile.dev.package.poe2-jewel-overlay]
codegen-units = 1

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = 3
strip = true
